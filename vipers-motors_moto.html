<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Moto — Vipers Motors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                VIPERS <span>MOTORS</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html" class="active">Motos</a>
            </nav>
            <a href="https://wa.me/5491112345678" target="_blank" class="btn-whatsapp-nav">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <section style="padding-top: 3rem;">
        <div style="max-width: 1100px; margin: 0 auto;" id="moto-detail-container">
            <!-- Loaded dynamically -->
            <p style="color: var(--text-muted); text-align: center; padding: 4rem;">Cargando detalles de la unidad...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <div class="footer-brand">
                <a href="index.html" class="logo" style="font-size: 1.8rem;">
                    VIPERS <span>MOTORS</span>
                </a>
                <p>Catálogo digital oficial y agenciamiento de motos en Zona Oeste, Buenos Aires.</p>
            </div>
            <div class="footer-links">
                <h4>Navegación</h4>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo de Motos</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <h4>Contacto</h4>
                <ul>
                    <li><a href="https://wa.me/5491112345678" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp Directo</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Vipers Motors. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/5491112345678" id="float-whatsapp" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const motoId = urlParams.get('id');

            try {
                const response = await fetch("data/motos.json");
                const motos = await response.json();
                const moto = motos.find(m => m.id === motoId) || motos[0]; // Fallback to first if not found

                const precioFormateado = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(moto.precio);
                const mensajeWa = encodeURIComponent(`Hola Vipers Motors, estoy interesado en la ${moto.marca} ${moto.modelo} ${moto.anio} (${precioFormateado}) publicada en la web. ¿Sigue disponible?`);
                const whatsappUrl = `https://wa.me/${moto.whatsapp}?text=${mensajeWa}`;

                document.getElementById('float-whatsapp').href = whatsappUrl;

                document.getElementById('moto-detail-container').innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem;">
                        <a href="catalogo.html" style="color: var(--text-muted); font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Volver al catálogo</a>
                        <span style="color: var(--border-color);">/</span>
                        <span style="color: var(--accent-red); font-weight: 600; font-size: 0.9rem;">${moto.id}</span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.5rem; align-items: start;">
                        <!-- Gallery Column -->
                        <div>
                            <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; height: 380px; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 1rem;">
                                <div style="position: absolute; top: 15px; left: 15px; background: rgba(8,8,8,0.85); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                                    <span style="width: 8px; height: 8px; background: var(--green-check); border-radius: 50%;"></span> VIPERS CHECK ${moto.vipers_check}
                                </div>
                                <div style="position: absolute; top: 15px; right: 15px; background: var(--accent-red); color: white; padding: 4px 10px; border-radius: 3px; font-family: var(--font-display);">
                                    ${moto.tipo_publicacion}
                                </div>
                                <i class="fas fa-motorcycle" style="font-size: 6rem; color: #333;"></i>
                            </div>
                            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                                <div style="background: var(--bg-card); border: 1px solid var(--border-color); height: 75px; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-motorcycle" style="color: #444;"></i></div>
                                <div style="background: var(--bg-card); border: 1px solid var(--border-color); height: 75px; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-motorcycle" style="color: #444;"></i></div>
                                <div style="background: var(--bg-card); border: 1px solid var(--border-color); height: 75px; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-motorcycle" style="color: #444;"></i></div>
                                <div style="background: var(--bg-card); border: 1px solid var(--border-color); height: 75px; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-motorcycle" style="color: #444;"></i></div>
                            </div>
                        </div>

                        <!-- Info Column -->
                        <div>
                            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; line-height: 1.1;">${moto.marca} ${moto.modelo}</h1>
                            <div style="color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1.5rem;">
                                <span><i class="far fa-calendar-alt"></i> ${moto.anio}</span>
                                <span><i class="fas fa-tachometer-alt"></i> ${moto.kilometros.toLocaleString()} KM</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${moto.ubicacion}</span>
                            </div>

                            <div style="font-family: var(--font-display); font-size: 2.8rem; color: white; margin-bottom: 1.5rem;">
                                ${precioFormateado}
                            </div>

                            <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 6px; margin-bottom: 1.5rem;">
                                <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;">${moto.descripcion}</p>
                                <div style="display: flex; gap: 1.5rem; font-size: 0.9rem; font-weight: 500;">
                                    <span>${moto.acepta_permuta ? '✔ Acepta permuta' : '✖ No acepta permuta'}</span>
                                    <span>${moto.precio_negociable ? '✔ Precio negociable' : ''}</span>
                                </div>
                            </div>

                            <!-- CTA WhatsApp -->
                            <a href="${whatsappUrl}" target="_blank" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1.2rem; background-color: #25D366; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fab fa-whatsapp" style="font-size: 1.4rem;"></i> CONSULTAR POR WHATSAPP
                            </a>

                            <!-- Vipers Check Box -->
                            <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 6px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem;">
                                    <h3 style="font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">
                                        <i class="fas fa-check-circle" style="color: var(--accent-red);"></i> INSPECCIÓN VIPERS CHECK
                                    </h3>
                                    <span style="font-family: var(--font-display); font-size: 1.4rem; color: var(--green-check);">${moto.vipers_check} / 10</span>
                                </div>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; font-size: 0.9rem;">
                                    <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary); border-radius: 4px;">
                                        <span>Motor</span> <span>🟢 ${moto.check_detalle.motor}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary); border-radius: 4px;">
                                        <span>Transmisión</span> <span>🟢 ${moto.check_detalle.transmision}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary); border-radius: 4px;">
                                        <span>Frenos</span> <span>🟢 ${moto.check_detalle.frenos}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary); border-radius: 4px;">
                                        <span>Cubiertas</span> <span>🟡 ${moto.check_detalle.cubiertas}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary); border-radius: 4px;">
                                        <span>Estética</span> <span>🟢 ${moto.check_detalle.estetica}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary); border-radius: 4px;">
                                        <span>Documentación</span> <span>🟢 ${moto.check_detalle.documentacion}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error("Error al cargar la ficha de la moto:", err);
            }
        });
    </script>
</body>
</html>
